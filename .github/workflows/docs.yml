name: Documentation

on:
  push:
    branches: [main]
    tags: ['v[0-9]*', '[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Relay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: relay
          persist-credentials: false
      - name: Check out the pinned documentation toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pustka-sh/Site
          # Pin the documentation renderer, validator and preview generator together.
          ref: f5e656f93894b88239f99d144bd0103b82ba632f
          path: site-toolchain
          persist-credentials: false
      - name: Install Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned toolchain dependencies
        working-directory: site-toolchain
        run: npm ci --ignore-scripts
      - name: Extract the Relay API and compile documentation examples
        working-directory: relay
        run: bash ./gradlew generatePustkaDocs checkPustkaExamples "-PpustkaDocsToolchain=$GITHUB_WORKSPACE/site-toolchain" --console=plain --no-daemon
      - name: Package and validate guides and API
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';
          const root = path.join(process.env.GITHUB_WORKSPACE, 'relay');
          const ref = process.env.GITHUB_EVENT_NAME === 'push' && process.env.GITHUB_REF.startsWith('refs/tags/')
            ? process.env.GITHUB_REF : 'refs/heads/main';
          const version = ref.startsWith('refs/tags/') ? ref.slice('refs/tags/'.length) : 'main';
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], {cwd: root, encoding: 'utf8'}).trim();
          execFileSync(process.execPath, [
            path.join(process.env.GITHUB_WORKSPACE, 'site-toolchain/scripts/package-docs.mjs'),
            '--manifest', path.join(root, 'pustka.docs.json'), '--root', root,
            '--api', path.join(root, 'build/pustka-docs/api.json'),
            '--out', path.join(root, 'build/pustka-docs/package.json'),
            '--version', version, '--commit', commit, '--ref', ref,
          ], {stdio: 'inherit'});
          NODE
      - name: Check links, source targets and documented example contents
        run: >-
          node site-toolchain/scripts/check-docs.mjs --root "$GITHUB_WORKSPACE/relay"
          --package "$GITHUB_WORKSPACE/relay/build/pustka-docs/package.json"
          --manifest "$GITHUB_WORKSPACE/relay/pustka.docs.json"
          --report "$GITHUB_WORKSPACE/relay/build/pustka-docs/quality.json"
      - name: Save documentation quality report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: relay-documentation-quality
          path: relay/build/pustka-docs/quality.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Render the documentation review preview
        run: >-
          node site-toolchain/scripts/preview-docs.mjs
          --file "$GITHUB_WORKSPACE/relay/build/pustka-docs/package.json"
          --out "$GITHUB_WORKSPACE/relay/build/pustka-docs/preview"
      - name: Save the rendered documentation preview
        id: preview
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: relay-documentation-preview
          path: relay/build/pustka-docs/preview
          if-no-files-found: error
          retention-days: 14
      - name: Link the rendered draft in the job summary
        env:
          PREVIEW_ARTIFACT_URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import path from 'node:path';
          const packagePath = path.join(process.env.GITHUB_WORKSPACE, 'relay/build/pustka-docs/package.json');
          const data = JSON.parse(readFileSync(packagePath, 'utf8'));
          const url = new URL(process.env.PREVIEW_ARTIFACT_URL);
          if (url.protocol !== 'https:' || url.hostname !== 'github.com') throw new Error('Unexpected artifact URL.');
          if (!/^[a-f0-9]{40}$/.test(data.source.commit)) throw new Error('Unexpected source commit.');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### Documentation review draft\n\n' +
            '[Download rendered HTML preview](' + url.href + ')\n\n' +
            'Extract the artifact and open `index.html`. This draft is not published.\n\n' +
            'Checked source commit: `' + data.source.commit + '`.\n');
          NODE
      - name: Save the validated package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: relay-documentation
          path: |
            relay/build/pustka-docs/package.json
            relay/build/pustka-docs/api.json
          if-no-files-found: error
          retention-days: 14

  # PR code and Gradle never run in the job that has the publication key.
  publish:
    needs: package
    if: >-
      github.repository == 'pustka-sh/Relay' &&
      ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the pinned publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pustka-sh/Site
          ref: f5e656f93894b88239f99d144bd0103b82ba632f
          path: site-toolchain
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned publisher dependencies
        working-directory: site-toolchain
        run: npm ci --ignore-scripts
      - name: Download the validated package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: relay-documentation
          path: documentation
      - name: Publish the signed documentation package
        env:
          PUSTKA_DOCS_PUBLISH_KEY: ${{ secrets.PUSTKA_DOCS_PUBLISH_KEY }}
          PUSTKA_DOCS_PUBLISH_URL: ${{ vars.PUSTKA_DOCS_PUBLISH_URL || 'https://pustka.sh/api/site/docs/publish' }}
        run: node site-toolchain/scripts/publish-docs.mjs --file documentation/package.json
